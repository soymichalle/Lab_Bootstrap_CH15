  - Una fila con dos columnas: un lateral angosto y un contenido

    Almuerzos, Jugos y Café (por ejemplo, con un list-group).

  - Todas las tarjetas de una fila miden lo mismo (h-100).
  - Más tarjetas por fila en el computador; menos en el celular.

Ejercicio 05 · A cazar en la documentación
  - Al menos 3 distintivos de color (Components → Badge) dentro de
    las tarjetas: "Nuevo", "Popular", "Sin conservantes"…
  - Una tabla de precios (Content → Tables) con la clase table,
    un <thead> con al menos 2 columnas y al menos 3 productos.

Ejercicio 08 · La letra
  - El mismo <link> de Google Fonts que en index.html.
============================================================
